# ==========================================================
# PostgreSQL Incident Intelligence
# Single-file Docker deployment
#
# Usage:
#   docker compose up -d
#
# Application:
#   http://localhost:8000
#
# PostgreSQL:
#   localhost:5433
# ==========================================================


# ----------------------------------------------------------
# CENTRAL CONFIGURATION
# Change values here. They are reused by the services below.
# ----------------------------------------------------------

x-config:
  postgres-database: &postgres-database incident_intelligence
  postgres-admin-user: &postgres-admin-user postgres
  postgres-admin-password: &postgres-admin-password "postgres@321"

  monitoring-user: &monitoring-user incident_app
  monitoring-password: &monitoring-password incident@321


services:

  # ========================================================
  # 1. PostgreSQL Database
  # ========================================================

  db:
    image: postgres:17
    container_name: pii-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: *postgres-database
      POSTGRES_USER: *postgres-admin-user
      POSTGRES_PASSWORD: *postgres-admin-password

    ports:
      - "127.0.0.1:5433:5432"

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

    networks:
      - dir-network


  # ========================================================
  # 2. Automatic PostgreSQL User Provisioning
  # ========================================================

  provision:
    image: kirankambale/kiran_db_replay_app.1:latest
    container_name: pii-app-provision

    entrypoint:
      - /bin/bash

    command:
      - /app/docker/provision/01-create-monitoring-role.sh

    environment:

      # PostgreSQL administrator connection
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: *postgres-database
      PGUSER: *postgres-admin-user
      PGPASSWORD: *postgres-admin-password

      # Application monitoring account
      DB_NAME: *postgres-database
      DB_USER: *monitoring-user
      DB_PASSWORD: *monitoring-password

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

    networks:
      - dir-network


  # ========================================================
  # 3. PostgreSQL Incident Intelligence Application
  # ========================================================

  app:
    image: kirankambale/kiran_db_replay_app.1:latest
    container_name: pii-app
    restart: unless-stopped

    environment:

      # Application mode
      DEMO_MODE: "True"
      AUTO_MONITOR: "true"
      DATA_DIR: /data

      # PostgreSQL connection
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: *postgres-database
      DB_USER: *monitoring-user
      DB_PASSWORD: *monitoring-password
      DB_SSLMODE: disable

      # Database instance information
      DB_INSTANCE_ID: docker-lab-1
      DB_INSTANCE_NAME: Kiran-test-Docker-PostgreSQL
      DB_ENVIRONMENT: Docker-environment

      # Monitoring configuration
      MONITOR_INTERVAL_SECONDS: "15"
      LONG_QUERY_SECONDS: "30"
      IDLE_TXN_SECONDS: "60"

      # Security and query configuration
      QUERY_TEXT_MODE: redact
      AUTH_MODE: none

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - incident_data:/data

    depends_on:
      provision:
        condition: service_completed_successfully

    networks:
      - dir-network

    # Container security
    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true


# ==========================================================
# PERSISTENT STORAGE
# ==========================================================

volumes:
  postgres_data:
  incident_data:


# ==========================================================
# INTERNAL DOCKER NETWORK
# ==========================================================

networks:
  dir-network:
    driver: bridge
